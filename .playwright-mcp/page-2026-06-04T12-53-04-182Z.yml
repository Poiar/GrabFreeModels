                  - generic [ref=e718]: "maxRetries: 3,"
                  - generic [ref=e719]: "},"
                  - generic [ref=e720]: "{"
                  - generic [ref=e721]: "model: \"anthropic/claude-4-5-sonnet\","
                  - generic [ref=e722]: "maxRetries: 2,"
                  - generic [ref=e723]: "},"
                  - generic [ref=e724]: "{"
                  - generic [ref=e725]: "model: \"google/gemini-2.5-pro\","
                  - generic [ref=e726]: "maxRetries: 2,"
                  - generic [ref=e727]: "},"
                  - generic [ref=e728]: "],"
                  - generic [ref=e729]: "});"
              - paragraph [ref=e730]: Mastra tries your primary model first. If it encounters a 500 error, rate limit, or timeout, it automatically switches to your first fallback. If that fails too, it moves to the next. Each model gets its own retry count before moving on.
              - paragraph [ref=e731]: Your users never experience the disruption - the response comes back with the same format, just from a different model. The error context is preserved as the system moves through your fallback chain, ensuring clean error propagation while maintaining streaming compatibility.
