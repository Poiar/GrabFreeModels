  <!-- Lid -->
  <rect x="10" y="22" width="44" height="10" rx="3" fill="white"/>
  <!-- Ribbon vertical -->
  <rect x="29" y="22" width="6" height="34" fill="url(#bg)"/>
  <!-- Ribbon horizontal -->
