services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: grabfreemodels-api
    env_file:
      - .env
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
