name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PowerShell
        uses: actions/setup-powershell@v2
        with:
          version: '7.4'

      - name: Install Pester
        run: Install-Module -Name Pester -Force -Scope CurrentUser

      - name: Run tests
        run: |
          pwsh -NoProfile -Command "Import-Module Pester; Invoke-Pester -Path tests -Output Detailed"
