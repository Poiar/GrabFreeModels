name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "**/*.{js,mjs,ts,vue,json,md}"

  vue-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-model-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vue-model-manager/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
